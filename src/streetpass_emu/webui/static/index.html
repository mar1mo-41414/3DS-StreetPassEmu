<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreetPassEmu</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2733;--mut:#667085;--line:#d9dee5;--acc:#0b7a75;--acc2:#0a5f5b;--bad:#b42318;--ok:#067647;--warn:#b54708;--tab:#e8ecf1}
@media (prefers-color-scheme:dark){:root{--bg:#14181d;--card:#1d232a;--fg:#e6eaef;--mut:#98a2b3;--line:#323b46;--acc:#2bb3ab;--acc2:#4cc9c1;--bad:#f97066;--ok:#47cd89;--warn:#fdb022;--tab:#262e37}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;font-weight:650}
header .sp{flex:1}
header select{padding:4px 6px}
nav{display:flex;gap:2px;padding:8px 16px 0;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--line)}
nav button{border:1px solid transparent;border-bottom:none;background:var(--tab);color:var(--fg);padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer;font:inherit;white-space:nowrap}
nav button.on{background:var(--card);border-color:var(--line);color:var(--acc2);font-weight:650;margin-bottom:-1px}
main{max-width:980px;margin:0 auto;padding:16px}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:10px}
.row>label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mut);flex:1 1 180px}
.row>label.sm{flex:0 1 120px}.row>label.wide{flex:2 1 320px}
input[type=text],input[type=number],select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg);width:100%}
input.mono,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
button.b{font:inherit;padding:7px 14px;border-radius:7px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
a.b{color:var(--acc2)}
button.b.sec{background:transparent;color:var(--acc2)}
button.b.dng{background:var(--bad);border-color:var(--bad)}
button.b:disabled{opacity:.45;cursor:default}
.mut{color:var(--mut);font-size:13px}.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.pill.ok{border-color:var(--ok)}.pill.bad{border-color:var(--bad)}
.icons{display:flex;gap:18px;flex-wrap:wrap}
.icon-box{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.icon-box .pv{width:96px;height:96px;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;background:var(--bg);image-rendering:pixelated}
.icon-box img{image-rendering:pixelated;max-width:96px;max-height:96px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--mut)}
.drop.over{border-color:var(--acc);color:var(--acc2)}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;font-size:13px;vertical-align:middle}
td input{padding:4px 6px}
pre#log{background:#0e1318;color:#d7dde5;padding:12px;border-radius:8px;height:60vh;overflow:auto;font-size:12.5px;white-space:pre-wrap;margin:0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#101828;color:#fff;padding:10px 16px;border-radius:8px;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
#toast.show{opacity:1}#toast.err{background:var(--bad)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px;font-size:13.5px}.kv span:nth-child(odd){color:var(--mut)}
details summary{cursor:pointer;color:var(--acc2);margin-bottom:8px}
</style>
</head>
<body>
<header>
  <h1>StreetPassEmu</h1>
  <span id="hdrMii" class="mut"></span>
  <span class="sp"></span>
  <label class="mut">Language <select id="lang"><option value="ja">日本語</option><option value="en">English</option></select></label>
</header>
<nav id="tabs"></nav>
<main>

<!-- ============ 送受信 ============ -->
<section class="tab" id="t-run">
  <div class="card">
    <h2 data-i="run_title"></h2>
    <div class="kv" style="margin-bottom:12px">
      <span data-i="cur_mii"></span><span id="runMii"></span>
      <span data-i="cur_box"></span><span id="runBox"></span>
      <span data-i="state"></span><span id="runState"></span>
    </div>
    <div class="row">
      <button class="b" id="btnStart" data-i="start"></button>
      <button class="b dng" id="btnStop" data-i="stop"></button>
      <button class="b sec" id="btnAdapters" data-i="adapters"></button>
      <button class="b sec" id="btnDoctor" data-i="doctor"></button>
    </div>
    <div class="mut" data-i="run_note"></div>
    <div id="doctorOut" class="mut" style="margin-top:8px"></div>
  </div>
  <div class="card">
    <h2 data-i="settings"></h2>
    <div class="row">
      <label class="wide"><span data-i="s_wifit3"></span><input type="text" id="s_wifit3_dir" class="mono"></label>
      <label class="sm"><span data-i="s_uvpy"></span><input type="text" id="s_uv_python" placeholder="3.12"></label>
      <label class="sm"><span data-i="s_channel"></span><input type="number" id="s_channel" min="1" max="13"></label>
      <label class="sm"><span data-i="s_cycle"></span><input type="number" id="s_cycle_seconds" min="10"></label>
      <label class="sm"><span data-i="s_cycles"></span><input type="number" id="s_cycles" min="0"></label>
    </div>
    <div class="row">
      <label class="wide"><span data-i="s_keyslot"></span><input type="text" id="s_keyslot_file" class="mono"></label>
      <label class="wide"><span data-i="s_friend"></span><input type="text" id="s_friend_code" class="mono" placeholder="1234-5678-9012"></label>
    </div>
    <div class="mut" style="margin:-4px 0 10px" data-i="s_friend_note"></div>
    <div class="row">
      <label class="wide"><span data-i="import_keys"></span><input type="file" id="aesKeysFile" accept=".txt,text/plain"></label>
      <span class="mut" style="flex:2 1 300px" data-i="import_keys_note"></span>
    </div>
    <details style="margin-bottom:12px">
      <summary data-i="adv"></summary>
      <div class="row">
        <label style="flex:2 1 300px;flex-direction:row;align-items:center;gap:8px;color:var(--fg)"><input type="checkbox" id="s_fresh_each_cycle"><span data-i="s_fresh"></span></label>
        <label style="flex:2 1 300px;flex-direction:row;align-items:center;gap:8px;color:var(--fg)"><input type="checkbox" id="s_verbose"><span data-i="s_verbose"></span></label>
      </div>
      <div class="row">
        <label class="sm"><span data-i="s_sleep"></span><input type="number" id="s_sleep_between_cycles" min="0" step="0.5"></label>
        <label class="sm"><span data-i="s_backoff"></span><input type="number" id="s_retry_backoff" min="0" step="0.5"></label>
        <label class="sm"><span data-i="s_retries"></span><input type="number" id="s_max_retries" min="0"></label>
        <label class="sm"><span data-i="s_probe"></span><input type="number" id="s_probe_interval" min="0" step="0.5" placeholder="off"></label>
      </div>
      <div class="mut" style="margin-bottom:8px" data-i="s_adv_note"></div>
      <div class="row">
        <label style="flex:2 1 300px;flex-direction:row;align-items:center;gap:8px;color:var(--fg)"><input type="checkbox" id="s_match_identity"><span data-i="s_match_id"></span></label>
        <label style="flex:2 1 300px;flex-direction:row;align-items:center;gap:8px;color:var(--fg)"><input type="checkbox" id="s_match_console_id"><span data-i="s_match_con"></span></label>
      </div>
      <div class="row">
        <label class="wide"><span data-i="s_extra"></span><input type="text" id="s_extra_args" class="mono" placeholder="--outbound-title-id 0x00020800"></label>
        <button class="b sec" id="btnLoopHelp" data-i="s_help"></button>
      </div>
      <div class="mut" data-i="s_extra_note"></div>
      <pre id="loopHelp" class="mono" style="display:none;max-height:260px;overflow:auto;white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px"></pre>
    </details>
    <button class="b" id="btnSaveSettings" data-i="save_settings"></button>
  </div>
  <div class="card">
    <h2 data-i="received"></h2>
    <div id="recvList" class="mut"></div>
  </div>
</section>

<!-- ============ Mii ============ -->
<section class="tab" id="t-mii">
  <div class="card">
    <h2 data-i="mii_cur"></h2>
    <div id="miiInfo"></div>
    <div class="row" style="margin-top:10px">
      <a class="b sec" id="miiDl" href="#" style="text-decoration:none;display:inline-block;padding:7px 14px;border-radius:7px;border:1px solid var(--acc)" data-i="mii_dl"></a>
      <button class="b sec" id="miiClear" data-i="mii_clear"></button>
    </div>
  </div>
  <div class="card">
    <h2 data-i="mii_qr"></h2>
    <div class="drop" id="qrDrop"><span data-i="drop_qr"></span><br><input type="file" id="qrFile" accept="image/*"></div>
    <div class="mut" style="margin-top:8px" data-i="qr_note"></div>
  </div>
  <div class="card">
    <h2 data-i="mii_file"></h2>
    <div class="row"><label class="wide"><span data-i="mii_file_lbl"></span><input type="file" id="miiFile"></label></div>
    <div class="mut" data-i="mii_file_note"></div>
  </div>
  <div class="card">
    <h2 data-i="mii_from_box"></h2>
    <div id="miiBoxList" class="mut"></div>
  </div>
</section>

<!-- ============ Box編集 ============ -->
<section class="tab" id="t-box">
  <div class="card">
    <h2 data-i="b_text"></h2>
    <div class="row">
      <label class="wide"><span><span data-i="b_comment"></span> <span class="mut" id="cmtCount"></span></span><input type="text" id="f_comment"></label>
      <label class="wide"><span><span data-i="b_notice"></span> <span class="mut" id="ntcCount"></span></span><input type="text" id="f_notice"></label>
    </div>
    <div class="mut" data-i="b_text_note"></div>
  </div>
  <div class="card">
    <h2 data-i="b_app"></h2>
    <div class="row">
      <label><span data-i="b_app_name"></span><input type="text" id="f_app_name"></label>
      <label><span data-i="b_app_long"></span><input type="text" id="f_app_long"></label>
      <label><span data-i="b_app_pub"></span><input type="text" id="f_app_publisher"></label>
    </div>
    <div class="row">
      <label class="wide"><span data-i="b_app_tid"></span><input type="text" id="f_app_title_id" class="mono"></label>
      <label class="sm"><span data-i="b_app_ver"></span><input type="text" id="f_app_title_version" class="mono"></label>
    </div>
    <div class="mut" data-i="b_app_note"></div>
  </div>
  <div class="card">
    <h2 data-i="b_res"></h2>
    <div class="row">
      <label class="sm"><span data-i="b_counter"></span><input type="number" id="f_counter" min="0" max="999999"></label>
      <label class="sm"><span data-i="b_country"></span><input type="number" id="f_country" min="0" max="255"></label>
      <label class="sm"><span data-i="b_region"></span><input type="number" id="f_region" min="0" max="255"></label>
    </div>
    <div class="row">
      <label><span data-i="b_country_ja"></span><input type="text" id="f_country_ja"></label>
      <label><span data-i="b_country_en"></span><input type="text" id="f_country_en"></label>
      <label><span data-i="b_region_ja"></span><input type="text" id="f_region_ja"></label>
      <label><span data-i="b_region_en"></span><input type="text" id="f_region_en"></label>
    </div>
    <div class="mut" data-i="b_res_note"></div>
  </div>
  <div class="card">
    <h2 data-i="b_icons"></h2>
    <div class="icons" id="iconsArea"></div>
    <div class="row" style="margin-top:12px"><label class="wide"><span data-i="b_smdh"></span><input type="file" id="smdhFile" accept=".smdh"></label></div>
    <div class="mut" data-i="b_icons_note"></div>
  </div>
</section>

<!-- ============ 識別情報 ============ -->
<section class="tab" id="t-id">
  <div class="card">
    <h2 data-i="i_mii"></h2>
    <div class="row">
      <label class="wide"><span>author_id (8 bytes)</span><input type="text" id="i_author" class="mono"></label>
      <label class="wide"><span>mii_id (10 bytes)</span><input type="text" id="i_miiid" class="mono"></label>
    </div>
    <div class="row">
      <button class="b" id="btnSetIds" data-i="apply"></button>
      <button class="b sec" id="btnRndAuthor" data-i="rnd_author"></button>
      <button class="b sec" id="btnRndMii" data-i="rnd_mii"></button>
    </div>
    <div class="mut" data-i="i_mii_note"></div>
  </div>
  <div class="card">
    <h2 data-i="i_header"></h2>
    <div class="row">
      <button class="b sec" id="btnNewIds" data-i="new_ids"></button>
      <button class="b sec" id="btnNewAll" data-i="new_all"></button>
      <button class="b" id="btnSetHeader" data-i="apply"></button>
    </div>
    <table id="hdrTable"></table>
    <div class="mut" style="margin-top:8px" data-i="i_header_note"></div>
  </div>
</section>

<!-- ============ ファイル ============ -->
<section class="tab" id="t-file">
  <div class="card">
    <h2 data-i="f_box"></h2>
    <div class="kv" style="margin-bottom:10px"><span data-i="f_source"></span><span id="fSource"></span>
      <span data-i="f_verify"></span><span id="fVerify"></span></div>
    <div class="row">
      <button class="b sec" id="btnNew" data-i="f_new"></button>
      <a class="b sec" id="boxDl" href="#" style="text-decoration:none;display:inline-block;padding:7px 14px;border-radius:7px;border:1px solid var(--acc)" data-i="f_download"></a>
    </div>
    <div class="row"><label class="wide"><span data-i="f_open"></span><input type="file" id="boxFile"></label></div>
    <div class="row">
      <label class="wide"><span data-i="f_name"></span><input type="text" id="saveName" value="box.bin"></label>
      <button class="b" id="btnSave" data-i="f_save"></button>
    </div>
    <div class="mut" data-i="f_note"></div>
  </div>
  <div class="card">
    <h2 data-i="f_ws"></h2>
    <div class="mut mono" id="wsPath" style="margin-bottom:8px"></div>
    <div id="fileList" class="mut"></div>
  </div>
</section>

<!-- ============ ログ ============ -->
<section class="tab" id="t-log">
  <div class="card">
    <div class="row"><button class="b sec" id="btnClearLog" data-i="log_clear"></button><span class="mut" data-i="log_note"></span></div>
    <pre id="log"></pre>
  </div>
</section>

</main>
<div id="toast"></div>

let lang=localStorage.getItem("lang")||((navigator.language||"").startsWith("ja")?"ja":"en");

const $=id=>document.getElementById(id);

function toast(msg,err){const e=$("toast");e.textContent=msg;e.className="show"+(err?" err":"");clearTimeout(toast.t);toast.t=setTimeout(()=>e.className="",err?5000:1800)}
function errText(code){const m=/^(\w+)(?::\s*(.*))?$/.exec(code||"");if(!m)return code;const k="e_"+m[1];if(!(k in T[lang]))return code;return t(k,...(m[2]||"").split(" "))}
async function api(path,body){
  const r=await fetch(path,{method:body===undefined?"GET":"POST",headers:{"X-Token":TOKEN,"Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body)});
  const j=await r.json().catch(()=>({error:"bad_data"}));
  if(!r.ok){toast(errText(j.error),true);throw new Error(j.error)}
  return j}
async function act(path,body,okMsg){try{S=await api(path,body);render();if(okMsg)toast(t(okMsg))}catch(e){/* shown */}}
const b64=buf=>{let s="";const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const readFile=f=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsArrayBuffer(f)});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function buildTabs(){$("tabs").innerHTML=TABS.map(k=>`<button data-k="${k}" class="${k===curTab?"on":""}">${t("tab_"+k)}</button>`).join("");

function showTab(){TABS.forEach(k=>$("t-"+k).classList.toggle("on",k===curTab));buildTabs();if(S)render()}
function applyI18n(){document.documentElement.lang=lang;document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));buildTabs()}

/* ---------- render ---------- */
function setVal(id,v){const e=$(id);if(e&&document.activeElement!==e)e.value=v??""}
function render(){
  if(!S)return;

  $("runState").innerHTML=S.running?`<span class="ok">${t("running")}</span>`:t("idle");
  $("btnStart").disabled=S.running||!S.verify.built;$("btnStop").disabled=!S.running;
  const st=S.settings;
  setVal("s_wifit3_dir",st.wifit3_dir);setVal("s_uv_python",st.uv_python);setVal("s_keyslot_file",st.keyslot_file);setVal("s_friend_code",st.friend_code);setVal("s_sleep_between_cycles",st.sleep_between_cycles);setVal("s_retry_backoff",st.retry_backoff);setVal("s_max_retries",st.max_retries);setVal("s_probe_interval",st.probe_interval);

  // mii tab
  $("miiInfo").innerHTML=mii?`<div class="kv"><span>nickname</span><span>${esc(mii.nickname)}</span><span>author_id</span><span class="mono">${mii.author_id}</span><span>mii_id</span><span class="mono">${mii.mii_id}</span></div>`:`<span class="mut">${t("v_none")}</span>`;
  $("miiDl").style.display=mii?"":"none";$("miiClear").disabled=!mii;

  $("miiBoxList").innerHTML=boxes.length?`<table>${boxes.map(f=>`<tr><td class="mono">${esc(f.name)}</td><td><button class="b sec" data-load="${esc(f.name)}" data-dir="received" data-as="mii_from_box">${t("use_mii")}</button></td></tr>`).join("")}</table>`:t("none");
  // box tab
  ["comment","notice","app_name","app_long","app_publisher","app_title_id","app_title_version","counter","country","region","country_ja","country_en","region_ja","region_en"].forEach(k=>setVal("f_"+k,S[k]));
  $("cmtCount").textContent=`${[...(S.comment||"")].length}/${S.limits.comment}`;$("ntcCount").textContent=`${[...(S.notice||"")].length}/${S.limits.notice}`;
  renderIcons();
  // identity
  setVal("i_author",mii?mii.author_id:"");setVal("i_miiid",mii?mii.mii_id:"");

  // file tab
  $("fSource").textContent=t(S.source==="loaded"?"src_loaded":"src_new")+(S.extra_body_bytes?`  (${t("kept",S.extra_body_bytes)})`:"");
  const v=S.verify;$("fVerify").innerHTML=v.built?[["v_hmac",v.hmac],["v_crc",v.mii_crc],["v_tag",v.mii_tag]].map(([k,ok])=>`<span class="pill ${ok?"ok":"bad"}">${t(k)} ${ok?"✓":"✗"}</span>`).join(" "):`<span class="mut">${t("v_none")}</span>`;
  $("boxDl").href="/api/box/download?t="+TOKEN;$("boxDl").style.display=v.built?"":"none";
  $("wsPath").textContent=S.workspace;
  loadFiles();
}
async function loadFiles(){try{const fs=await api("/api/files");
  $("fileList").innerHTML=fs.length?`<table>${fs.map(f=>`<tr><td class="mono">${f.dir?esc(f.dir)+"/":""}${esc(f.name)}</td><td>${f.kind}</td><td>${(f.size/1024).toFixed(1)} KB</td><td><button class="b sec" data-load="${esc(f.name)}" data-dir="${f.dir}">${t("load")}</button></td></tr>`).join("")}</table>`:t("none")}catch(e){}}

/* ---------- icons ---------- */
const ICONS=[["large",48],["small",24],["header",40]];
function renderIcons(){
  $("iconsArea").innerHTML=ICONS.map(([k,sz])=>{const u=S.icons[k];return `<div class="icon-box"><b>${t("icon_"+k)}</b><div class="pv">${u?`<img src="${u}">`:t("no_icon")}</div><input type="file" accept="image/*" data-icon="${k}" data-size="${sz}" style="max-width:190px"><button class="b sec" data-clear="${k}">${t("clear")}</button></div>`}).join("");
  document.querySelectorAll("[data-icon]").forEach(inp=>inp.onchange=async()=>{const f=inp.files[0];if(!f)return;await iconFromImage(f,inp.dataset.icon,+inp.dataset.size)});
  document.querySelectorAll("[data-clear]").forEach(b=>b.onclick=()=>act("/api/icon",{kind:b.dataset.clear,clear:true}));

function iconFromImage(file,kind,size){return new Promise(res=>{const img=new Image();img.onload=async()=>{
  const c=document.createElement("canvas");c.width=c.height=size;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,size,size);x.imageSmoothingQuality="high";x.drawImage(img,0,0,size,size);
  const d=x.getImageData(0,0,size,size).data,rgb=new Uint8Array(size*size*3);for(let i=0,j=0;i<d.length;i+=4){rgb[j++]=d[i];rgb[j++]=d[i+1];rgb[j++]=d[i+2]}
  URL.revokeObjectURL(img.src);await act("/api/icon",{kind,rgb:b64(rgb.buffer)});res()};img.onerror=()=>{toast(t("e_bad_data"),true);res()};img.src=URL.createObjectURL(file)})}

async function pollLog(){try{const r=await api("/api/log?since="+logNext);if(r.lines.length){const p=$("log"),atEnd=p.scrollTop+p.clientHeight>=p.scrollHeight-20;p.textContent+=r.lines.join("\n")+"\n";if(atEnd)p.scrollTop=p.scrollHeight}logNext=r.next}catch(e){}}
async function pollState(){if(curTab!=="run"&&!(S&&S.running))return;try{const s=await api("/api/state");const a=document.activeElement;if(!a||a.tagName!=="INPUT"){S=s;render()}else{S.running=s.running;S.received=s.received}}catch(e){}}
