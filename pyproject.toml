[project]
name = "streetpass-emu"
version = "0.1.0"
description = "PC-based emulation of Nintendo 3DS StreetPass (research/reverse-engineering project)"
requires-python = ">=3.10"
dependencies = [
    "pycryptodome>=3.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyctr>=0.7"]
# Mii QRコード画像の生成
tools = ["qrcode[pil]>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streetpass_emu"]
