[project]
name = "streetpass-emu"
version = "0.1.0"
description = "PC-based emulation of Nintendo 3DS StreetPass (research/reverse-engineering project)"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pycryptodome>=3.20",
    "pillow>=10",   # icons from images in scripts/build_tmp_box.py
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyctr>=0.7"]
# Mii QRコード画像の生成
tools = ["qrcode[pil]>=8.0"]
mii-qr = ["pyzbar>=0.1.9"]
# alternative QR decoder that needs no system library (any OS)
mii-qr-opencv = ["opencv-python-headless>=4.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streetpass_emu"]
